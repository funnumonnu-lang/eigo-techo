<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>えいご手帳</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#f5f4f0;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent;}
    #app{max-width:480px;min-height:100dvh;margin:0 auto;background:#f5f4f0;display:flex;flex-direction:column;}
    .screen{display:none;}
    .screen.active{display:flex;flex-direction:column;min-height:100dvh;}

    /* ===== BOTTOM NAV ===== */
    .bottom-nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;
      background:#fff;border-top:0.5px solid #e0e0e0;
      display:flex;z-index:100;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:10px 0;gap:3px;border:none;background:none;cursor:pointer;
      font-family:'Nunito',sans-serif;-webkit-appearance:none;
    }
    .nav-icon{font-size:22px;line-height:1;}
    .nav-label{font-size:10px;font-weight:700;color:#aaa;letter-spacing:0.04em;}
    .nav-btn.active .nav-label{color:#534AB7;}
    .nav-btn.active .nav-icon{filter:none;}

    /* ===== START SCREEN ===== */
    #start-screen{align-items:center;justify-content:flex-start;gap:18px;padding:32px 20px 100px;}
    .app-header{display:flex;align-items:center;gap:12px;width:100%;}
    .app-icon{font-size:40px;line-height:1;}
    .app-title{font-size:28px;font-weight:800;color:#1a1a1a;}
    .app-sub{font-size:13px;color:#888;}

    /* streak bar */
    .streak-card{
      width:100%;background:#fff;border:0.5px solid #e0e0e0;border-radius:16px;
      padding:16px 20px;display:flex;align-items:center;gap:14px;
    }
    .streak-flame{font-size:32px;line-height:1;}
    .streak-info{flex:1;}
    .streak-num{font-size:24px;font-weight:800;color:#534AB7;}
    .streak-label{font-size:12px;color:#888;margin-top:1px;}

    .section-label{font-size:12px;font-weight:700;color:#aaa;letter-spacing:0.1em;align-self:flex-start;}
    .level-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .level-btn{
      background:#fff;border:2px solid #e0e0e0;border-radius:16px;
      padding:14px 10px;cursor:pointer;text-align:center;
      transition:border-color .15s,background .15s;-webkit-appearance:none;
      display:flex;flex-direction:column;gap:3px;align-items:center;
    }
    .level-btn:active{transform:scale(.97);}
    .level-btn.selected{border-color:#534AB7;background:#EEEDFE;}
    .level-btn .lv-emoji{font-size:26px;line-height:1;}
    .level-btn .lv-name{font-size:13px;font-weight:800;color:#1a1a1a;}
    .level-btn .lv-stat{font-size:11px;color:#aaa;}
    .level-btn.selected .lv-name{color:#3C3489;}
    .level-btn.selected .lv-stat{color:#534AB7;}

    .rule-note{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:12px 18px;font-size:13px;color:#666;width:100%;line-height:1.9;}
    .rule-note strong{color:#1a1a1a;font-weight:700;}
    .start-btn{
      background:#534AB7;color:#EEEDFE;border:none;border-radius:16px;padding:18px;
      font-size:20px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;
      -webkit-appearance:none;width:100%;transition:opacity .15s;
    }
    .start-btn:active{opacity:.9;}


    /* ===== WEAK DRILL BUTTON ===== */
    .weak-drill-btn{
      width:100%;background:#FFF3CD;border:2px solid #EF9F27;border-radius:16px;
      padding:16px;cursor:pointer;-webkit-appearance:none;
      display:flex;align-items:center;gap:12px;transition:opacity .15s;
    }
    .weak-drill-btn:active{opacity:.85;}
    .weak-drill-btn.disabled{opacity:.4;cursor:default;border-color:#ddd;background:#f7f7f5;}
    .weak-drill-icon{font-size:28px;line-height:1;flex-shrink:0;}
    .weak-drill-info{flex:1;text-align:left;}
    .weak-drill-title{font-size:15px;font-weight:800;color:#633806;}
    .weak-drill-sub{font-size:12px;color:#854F0B;margin-top:2px;}
    .weak-drill-count{font-size:22px;font-weight:800;color:#BA7517;flex-shrink:0;}

    /* 記録画面の苦手ドリルボタン */
    .rec-drill-btn{
      width:100%;background:#FFF3CD;border:2px solid #EF9F27;border-radius:14px;
      padding:14px 18px;cursor:pointer;-webkit-appearance:none;
      display:flex;align-items:center;gap:10px;transition:opacity .15s;
      font-family:'Nunito',sans-serif;
    }
    .rec-drill-btn:active{opacity:.85;}
    .rec-drill-btn.disabled{opacity:.4;cursor:default;border-color:#ddd;background:#f7f7f5;}
    .rec-drill-btn-icon{font-size:22px;}
    .rec-drill-btn-text{flex:1;text-align:left;}
    .rec-drill-btn-title{font-size:14px;font-weight:800;color:#633806;}
    .rec-drill-btn-sub{font-size:11px;color:#854F0B;}
    /* ===== QUIZ SCREEN ===== */
    #quiz-screen{background:#f5f4f0;}
    .quiz-header{
      background:#fff;border-bottom:0.5px solid #e0e0e0;padding:12px 16px;
      display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
    }
    .level-badge{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap;flex-shrink:0;}
    .progress-wrap{flex:1;height:8px;background:#ebebeb;border-radius:99px;overflow:hidden;}
    .progress-fill{height:100%;background:#534AB7;border-radius:99px;transition:width .4s ease;}
    .q-num{font-size:13px;font-weight:700;color:#888;min-width:44px;text-align:right;}
    .score-pill{background:#EEEDFE;color:#3C3489;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap;}
    .quiz-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px 120px;gap:18px;}
    .hint-label{font-size:12px;font-weight:700;color:#aaa;letter-spacing:.1em;}
    .jp-word{font-size:52px;font-weight:800;color:#1a1a1a;text-align:center;line-height:1.2;}
    .hint-tag{background:#ebebeb;border-radius:99px;padding:5px 18px;font-size:14px;color:#666;}
    .input-wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;}
    .answer-input{
      width:100%;height:68px;background:#fff;border:2px solid #ccc;border-radius:16px;
      font-size:30px;font-weight:700;font-family:'Nunito',sans-serif;color:#1a1a1a;
      text-align:center;padding:0 16px;outline:none;transition:border-color .2s;-webkit-appearance:none;
    }
    .answer-input:focus{border-color:#534AB7;}
    .answer-input.correct-anim{border-color:#0F6E56;background:#E1F5EE;color:#085041;}
    .answer-input.wrong-anim{border-color:#993C1D;background:#FAECE7;color:#4A1B0C;}
    .btn-row{display:flex;gap:10px;}
    .btn-clear{background:none;border:1px solid #ccc;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;font-family:'Nunito',sans-serif;color:#888;cursor:pointer;white-space:nowrap;-webkit-appearance:none;}
    .btn-submit{flex:1;background:#534AB7;border:none;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:700;font-family:'Nunito',sans-serif;color:#EEEDFE;cursor:pointer;transition:opacity .15s;-webkit-appearance:none;}
    .btn-submit:disabled{opacity:.35;cursor:default;}
    .feedback-inline{width:100%;max-width:420px;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;}
    .feedback-inline.show{opacity:1;transform:translateY(0);}
    .feedback-inline.correct{background:#E1F5EE;border:0.5px solid #5DCAA5;}
    .feedback-inline.wrong{background:#FAECE7;border:0.5px solid #F0997B;}
    .fb-mark{font-size:24px;font-weight:800;flex-shrink:0;}
    .fb-mark.c{color:#0F6E56;} .fb-mark.w{color:#993C1D;}
    .fb-text{display:flex;flex-direction:column;gap:3px;}
    .fb-msg{font-size:16px;font-weight:700;}
    .fb-msg.c{color:#085041;} .fb-msg.w{color:#4A1B0C;}
    .fb-ans{font-size:14px;color:#666;}
    .next-bar{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;background:#fff;border-top:0.5px solid #e0e0e0;
      padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
      opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;
    }
    .next-bar.show{opacity:1;pointer-events:auto;}
    .btn-next{width:100%;background:#534AB7;color:#EEEDFE;border:none;border-radius:14px;padding:18px;font-size:18px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;-webkit-appearance:none;}

    /* ===== RESULT SCREEN ===== */
    #result-screen{align-items:center;justify-content:center;gap:18px;padding:40px 20px 100px;text-align:center;}
    .result-title{font-size:26px;font-weight:800;color:#1a1a1a;}
    .result-lv{font-size:13px;font-weight:700;border-radius:99px;padding:4px 14px;display:inline-block;}
    .result-big{font-size:80px;font-weight:800;color:#534AB7;line-height:1;}
    .result-sub{font-size:16px;color:#888;}
    .result-comment{font-size:18px;font-weight:700;color:#1a1a1a;}
    .wrong-box{width:100%;max-width:380px;background:#fff;border:0.5px solid #e0e0e0;border-radius:16px;overflow:hidden;}
    .wrong-head{padding:10px 18px;font-size:12px;font-weight:700;color:#888;background:#f7f7f5;border-bottom:0.5px solid #e0e0e0;letter-spacing:.06em;}
    .wrong-row{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:15px;border-bottom:0.5px solid #e0e0e0;}
    .wrong-row:last-child{border-bottom:none;}
    .wrong-jp{color:#888;}
    .wrong-en{font-weight:700;color:#3C3489;font-size:16px;}
    .result-btns{display:flex;flex-direction:column;gap:10px;width:100%;}
    .retry-btn{background:#534AB7;color:#EEEDFE;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;-webkit-appearance:none;width:100%;}
    .back-btn{background:none;color:#534AB7;border:2px solid #534AB7;border-radius:16px;padding:14px;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;-webkit-appearance:none;width:100%;}

    /* ===== RECORD SCREEN ===== */
    #record-screen{padding:24px 20px 100px;gap:20px;overflow-y:auto;}
    .rec-header{display:flex;align-items:center;justify-content:space-between;width:100%;}
    .rec-title{font-size:22px;font-weight:800;color:#1a1a1a;}
    .rec-clear-btn{font-size:12px;color:#aaa;background:none;border:0.5px solid #ddd;border-radius:8px;padding:5px 10px;font-family:'Nunito',sans-serif;cursor:pointer;}

    /* streak */
    .rec-streak{
      width:100%;background:#534AB7;border-radius:16px;padding:20px;
      display:flex;align-items:center;gap:16px;
    }
    .rec-streak-flame{font-size:40px;line-height:1;}
    .rec-streak-body{flex:1;}
    .rec-streak-num{font-size:36px;font-weight:800;color:#fff;line-height:1;}
    .rec-streak-label{font-size:13px;color:#AFA9EC;margin-top:2px;}

    /* stat grid */
    .stat-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .stat-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:14px;padding:14px 16px;}
    .stat-label{font-size:11px;font-weight:700;color:#aaa;letter-spacing:.06em;margin-bottom:6px;}
    .stat-val{font-size:26px;font-weight:800;color:#1a1a1a;}
    .stat-sub{font-size:12px;color:#aaa;margin-top:2px;}

    /* level stats */
    .level-stats-box{width:100%;background:#fff;border:0.5px solid #e0e0e0;border-radius:16px;overflow:hidden;}
    .lv-stat-row{padding:14px 18px;border-bottom:0.5px solid #f0f0f0;display:flex;align-items:center;gap:12px;}
    .lv-stat-row:last-child{border-bottom:none;}
    .lv-stat-emoji{font-size:20px;flex-shrink:0;}
    .lv-stat-info{flex:1;}
    .lv-stat-name{font-size:14px;font-weight:700;color:#1a1a1a;}
    .lv-stat-count{font-size:12px;color:#aaa;}
    .lv-stat-bar-wrap{width:80px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
    .lv-stat-pct{font-size:14px;font-weight:800;}
    .lv-bar-bg{width:80px;height:6px;background:#f0f0f0;border-radius:99px;overflow:hidden;}
    .lv-bar-fill{height:100%;border-radius:99px;transition:width .6s ease;}

    /* history */
    .history-box{width:100%;background:#fff;border:0.5px solid #e0e0e0;border-radius:16px;overflow:hidden;}
    .history-row{padding:12px 18px;border-bottom:0.5px solid #f0f0f0;display:flex;align-items:center;gap:12px;}
    .history-row:last-child{border-bottom:none;}
    .history-date{font-size:13px;color:#888;min-width:80px;}
    .history-lv{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;}
    .history-score{font-size:14px;font-weight:800;color:#1a1a1a;margin-left:auto;}
    .history-pct{font-size:12px;color:#aaa;min-width:36px;text-align:right;}

    /* weak words */
    .weak-box{width:100%;background:#fff;border:0.5px solid #e0e0e0;border-radius:16px;overflow:hidden;}
    .weak-row{padding:10px 18px;border-bottom:0.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;}
    .weak-row:last-child{border-bottom:none;}
    .weak-jp{font-size:14px;color:#666;}
    .weak-right{display:flex;align-items:center;gap:10px;}
    .weak-en{font-size:15px;font-weight:700;color:#3C3489;}
    .weak-cnt{font-size:12px;background:#FAECE7;color:#993C1D;border-radius:99px;padding:2px 8px;font-weight:700;}

    .empty-note{font-size:14px;color:#aaa;text-align:center;padding:24px;}

    /* review list */
    .review-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:0.5px solid #f0f0f0;font-size:14px;}
    .review-row:last-child{border-bottom:none;}
    .review-ok{background:#fff;}
    .review-ng{background:#FFF8F6;}
    .review-num{font-size:12px;color:#aaa;font-weight:700;min-width:18px;}
    .review-mark{font-size:16px;font-weight:800;min-width:20px;}
    .review-ok .review-mark{color:#0F6E56;}
    .review-ng .review-mark{color:#993C1D;}
    .review-jp{color:#666;min-width:80px;flex-shrink:0;}
    .review-ans{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;}
    .review-correct{font-weight:800;color:#0F6E56;}
    .review-user{font-weight:700;color:#993C1D;text-decoration:line-through;}
    .review-arrow{color:#aaa;font-size:12px;}

    /* colors */
    .lv-elem{background:#E1F5EE;color:#0F6E56;}
    .lv-jh1{background:#EEEDFE;color:#3C3489;}
    .lv-jh2{background:#FAECE7;color:#993C1D;}
    .lv-jh3{background:#FFF3CD;color:#7A5C00;}
  </style>
</head>
<body>
<div id="app">

  <!-- ===== START ===== -->
  <div id="start-screen" class="screen active">
    <div class="app-header">
      <div class="app-icon">✏️</div>
      <div>
        <div class="app-title">えいご手帳</div>
        <div class="app-sub">日本語を見て英単語を入力しよう</div>
      </div>
    </div>

    <div class="streak-card" id="start-streak-card">
      <div class="streak-flame">🔥</div>
      <div class="streak-info">
        <div class="streak-num" id="start-streak-num">0</div>
        <div class="streak-label">日連続学習中</div>
      </div>
    </div>

    <div style="width:100%">
      <div class="section-label" style="margin-bottom:10px">レベルを選んでね</div>
      <div class="level-grid">
        <button class="level-btn selected" onclick="selectLevel('elem',this)">
          <span class="lv-emoji">🌱</span>
          <span class="lv-name">小学校</span>
          <span class="lv-stat" id="stat-elem">未挑戦</span>
        </button>
        <button class="level-btn" onclick="selectLevel('jh1',this)">
          <span class="lv-emoji">📘</span>
          <span class="lv-name">中学1年生</span>
          <span class="lv-stat" id="stat-jh1">未挑戦</span>
        </button>
        <button class="level-btn" onclick="selectLevel('jh2',this)">
          <span class="lv-emoji">📗</span>
          <span class="lv-name">中学2年生</span>
          <span class="lv-stat" id="stat-jh2">未挑戦</span>
        </button>
        <button class="level-btn" onclick="selectLevel('jh3',this)">
          <span class="lv-emoji">📙</span>
          <span class="lv-name">中学3年生</span>
          <span class="lv-stat" id="stat-jh3">未挑戦</span>
        </button>
      </div>
    </div>

    <div class="rule-note">
      <strong>判定ルール</strong><br>
      ・大文字・小文字を区別する<br>
      ・1文字でもミスは不正解
    </div>
    <button class="weak-drill-btn" id="home-weak-btn" onclick="startWeakDrill()">
      <span class="weak-drill-icon">🔥</span>
      <div class="weak-drill-info">
        <div class="weak-drill-title">苦手ドリル</div>
        <div class="weak-drill-sub" id="home-weak-sub">まちがえた単語を集中練習</div>
      </div>
      <span class="weak-drill-count" id="home-weak-count"></span>
    </button>
    <button class="start-btn" onclick="startQuiz()">スタート！</button>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quiz-screen" class="screen">
    <div class="quiz-header">
      <span class="level-badge" id="quiz-lv-badge"></span>
      <div class="progress-wrap"><div class="progress-fill" id="prog"></div></div>
      <div class="q-num" id="qnum">1 / 10</div>
      <div class="score-pill" id="spill">✓ 0</div>
    </div>
    <div class="quiz-body">
      <div class="hint-label">日本語 → 英語</div>
      <div class="jp-word" id="jpword">—</div>
      <div class="hint-tag" id="hint-tag"></div>
      <div class="input-wrap">
        <input class="answer-input" id="ans-input" type="text"
          placeholder="ここに入力" autocomplete="off" autocorrect="off"
          autocapitalize="none" spellcheck="false"
          oninput="onInput()" onkeydown="onKey(event)"/>
        <div class="btn-row">
          <button class="btn-clear" onclick="clearInput()">消す</button>
          <button class="btn-submit" id="btn-sub" onclick="submitAnswer()" disabled>判定する</button>
        </div>
      </div>
      <div class="feedback-inline" id="fb-inline">
        <div class="fb-mark" id="fb-mark"></div>
        <div class="fb-text">
          <div class="fb-msg" id="fb-msg"></div>
          <div class="fb-ans" id="fb-ans"></div>
        </div>
      </div>
    </div>
    <div class="next-bar" id="next-bar">
      <button class="btn-next" onclick="nextQ()">つぎへ →</button>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="result-screen" class="screen">
    <div class="result-title">お疲れ様！</div>
    <div><span class="result-lv" id="result-lv-badge"></span></div>
    <div class="result-big" id="res-score">0</div>
    <div class="result-sub" id="result-sub-text">/ 10問 正解</div>
    <div class="result-comment" id="res-comment"></div>
    <div class="wrong-box" id="res-wrong-box" style="display:none">
      <div class="wrong-head" id="res-wrong-head">まちがえた単語</div>
      <div id="res-wrong-items"></div>
    </div>
    <div class="result-btns">
      <button class="retry-btn" id="retry-btn" onclick="retryQuiz()">同じレベルでもう一度！</button>
      <button class="weak-drill-btn" id="result-weak-btn" style="margin:0" onclick="startWeakDrill()">
        <span class="weak-drill-icon">🔥</span>
        <div class="weak-drill-info">
          <div class="weak-drill-title">苦手ドリル</div>
          <div class="weak-drill-sub" id="result-weak-sub">まちがえた単語を集中練習</div>
        </div>
        <span class="weak-drill-count" id="result-weak-count"></span>
      </button>
      <button class="back-btn" onclick="showScreen('start-screen')">レベルを選び直す</button>
    </div>
  </div>

  <!-- ===== RECORD ===== -->
  <div id="record-screen" class="screen">
    <div class="rec-header">
      <div class="rec-title">📊 学習記録</div>
      <button class="rec-clear-btn" onclick="confirmClear()">リセット</button>
    </div>

    <!-- streak -->
    <div class="rec-streak">
      <div class="rec-streak-flame">🔥</div>
      <div class="rec-streak-body">
        <div class="rec-streak-num" id="rec-streak-num">0</div>
        <div class="rec-streak-label">日連続学習中</div>
      </div>
    </div>

    <!-- total stats -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">総挑戦回数</div>

/* ===================== STORAGE ===================== */
const STORAGE_KEY='eigo_techo_v1';
function loadData(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||initData();}
  catch{return initData();}
}
function initData(){
  return{sessions:[],weakWords:{},lastDate:null,streak:0};
}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}

/* streak update */
function updateStreak(d){
  const today=todayStr();
  if(d.lastDate===today) return; // 同日は更新しない
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  if(d.lastDate===yStr){d.streak=(d.streak||0)+1;}
  else{d.streak=1;}
  d.lastDate=today;
}
function todayStr(){return new Date().toISOString().slice(0,10);}

/* save one session */
function saveSession(level,score,wrongWords){
  const d=loadData();
  updateStreak(d);
  d.sessions.push({date:todayStr(),level,score,total:10});
  wrongWords.forEach(w=>{
    const key=w.en;
    d.weakWords[key]=d.weakWords[key]||{jp:w.jp,en:w.en,count:0};
    d.weakWords[key].count++;
  });
  saveData(d);
}

/* ===================== APP STATE ===================== */
let currentLevel='elem';
let qs=[],idx=0,score=0,wrongs=[],results=[],answered=false,isWeakDrill=false;

/* ===================== NAV ===================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  const nav=document.getElementById('bottom-nav');
  nav.style.display=(id==='quiz-screen')?'none':'flex';
}
function navTo(screenId,navId){
  showScreen(screenId);
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(navId).classList.add('active');
  if(screenId==='record-screen') renderRecord();
  if(screenId==='start-screen') renderStartStats();
}

/* ===================== LEVEL SELECT ===================== */
function selectLevel(lv,btn){
  currentLevel=lv;
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

/* ===================== QUIZ ===================== */
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function retryQuiz(){
  if(isWeakDrill) startWeakDrill(); else startQuiz();
}
function startWeakDrill(){
  const d=loadData();
  const weakArr=Object.values(d.weakWords||{}).sort((a,b)=>b.count-a.count).slice(0,10);
  if(weakArr.length===0){alert('まだ苦手単語がありません！\nまずは通常ドリルに挑戦してみよう。');return;}
  // weakWords は {jp,en,count} 形式。hint がないので汎用ヒントを付ける
  qs=shuffle(weakArr.map(w=>({jp:w.jp,en:w.en,hint:'苦手単語 🔥'})));
  idx=0;score=0;wrongs=[];results=[];answered=false;transitioning=false;isWeakDrill=true;
  const badge=document.getElementById('quiz-lv-badge');
  badge.textContent='🔥 苦手ドリル';
  badge.className='level-badge lv-jh3';
  document.getElementById('qnum').textContent=`1 / ${qs.length}`;
  showScreen('quiz-screen');
  loadQ();
}
function startQuiz(){
  qs=shuffle(WORD_DB[currentLevel]).slice(0,10);
  idx=0;score=0;wrongs=[];results=[];answered=false;transitioning=false;isWeakDrill=false;
  const lv=LEVEL_INFO[currentLevel];
  const badge=document.getElementById('quiz-lv-badge');
  badge.textContent=lv.emoji+' '+lv.name;
  badge.className='level-badge '+lv.cls;
  showScreen('quiz-screen');
  loadQ();
}
function loadQ(){
  answered=false;
  const q=qs[idx];
  document.getElementById('jpword').textContent=q.jp;
  document.getElementById('hint-tag').textContent=q.hint;
  const total=qs.length;
  document.getElementById('qnum').textContent=`${idx+1} / ${total}`;
  document.getElementById('prog').style.width=`${((idx+1)/qs.length)*100}%`;
  document.getElementById('spill').textContent=`✓ ${score}`;
  const inp=document.getElementById('ans-input');
  inp.value='';inp.className='answer-input';inp.disabled=false;
  document.getElementById('btn-sub').disabled=true;
  document.getElementById('fb-inline').className='feedback-inline';
  document.getElementById('next-bar').className='next-bar';
  setTimeout(()=>inp.focus(),80);
}
function onInput(){
  if(answered)return;
  const inp=document.getElementById('ans-input');
  // Apple Pencil入力の先頭大文字を自動で小文字に変換
  const pos=inp.selectionStart;
  inp.value=inp.value.toLowerCase();
  inp.setSelectionRange(pos,pos);
  document.getElementById('btn-sub').disabled=inp.value.length===0;
}
function onKey(e){
  if(e.key==='Enter'){
    if(!answered&&document.getElementById('ans-input').value.length>0)submitAnswer();
    else if(answered)nextQ();
  }
}
function clearInput(){
  if(answered)return;
  const inp=document.getElementById('ans-input');
  inp.value='';inp.className='answer-input';
  document.getElementById('btn-sub').disabled=true;
  inp.focus();
}
function submitAnswer(){
  if(answered)return;
  answered=true;
  const q=qs[idx];
  const userAns=document.getElementById('ans-input').value;
  const ok=userAns.trim().toLowerCase()===q.en.toLowerCase();
  if(ok){score++;}else{wrongs.push(q);}
  results.push({jp:q.jp,en:q.en,userAns,ok});
  const inp=document.getElementById('ans-input');
  inp.disabled=true;
  inp.className='answer-input '+(ok?'correct-anim':'wrong-anim');
  document.getElementById('btn-sub').disabled=true;
  document.getElementById('spill').textContent=`✓ ${score}`;
  document.getElementById('fb-mark').className='fb-mark '+(ok?'c':'w');
  document.getElementById('fb-mark').textContent=ok?'○':'✕';
  document.getElementById('fb-msg').className='fb-msg '+(ok?'c':'w');
  document.getElementById('fb-msg').textContent=ok?'正解！':'ざんねん…';
  document.getElementById('fb-ans').textContent=ok?`"${q.en}" ピッタリ！`:`こたえ: ${q.en}`;
  document.getElementById('fb-inline').className='feedback-inline show '+(ok?'correct':'wrong');
  document.getElementById('next-bar').className='next-bar show';
}
function nextQ(){
  if(!answered)return;
  answered=false; // 二重呼び出し防止
  idx++;
  if(idx>=qs.length){
    finishQuiz();
  }else{
    loadQ();
  }
}
function finishQuiz(){
  if(!isWeakDrill) saveSession(currentLevel,score,wrongs);
  // 正解した苦手単語のカウントを減らす
  if(isWeakDrill){
    const d=loadData();
    results.forEach(r=>{
      if(r.ok && d.weakWords[r.en]){
        d.weakWords[r.en].count=Math.max(0,d.weakWords[r.en].count-1);
        if(d.weakWords[r.en].count===0) delete d.weakWords[r.en];
      }
    });
    saveData(d);
  }
  showResult();
}

/* ===================== RESULT ===================== */
function showResult(){
  showScreen('result-screen');
  // nav は非表示にしない（結果画面はナビ付き）
  document.getElementById('bottom-nav').style.display='flex';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const lv=LEVEL_INFO[currentLevel];
  const badge=document.getElementById('result-lv-badge');
  if(isWeakDrill){badge.textContent='🔥 苦手ドリル';badge.className='result-lv lv-jh3';}
  else{badge.textContent=lv.emoji+' '+lv.name;badge.className='result-lv '+lv.cls;}
  // 苦手ドリルボタンの状態を更新
  const d=loadData();
  const wc=Object.keys(d.weakWords||{}).length;
  const rwBtn=document.getElementById('result-weak-btn');
  const rwSub=document.getElementById('result-weak-sub');
  const rwCnt=document.getElementById('result-weak-count');
  if(wc===0){rwBtn.classList.add('disabled');rwBtn.onclick=null;rwSub.textContent='苦手単語がなくなりました！';rwCnt.textContent='';}
  else{rwBtn.classList.remove('disabled');rwBtn.onclick=startWeakDrill;rwSub.textContent='まちがえた単語を集中練習';rwCnt.textContent=Math.min(wc,10)+'問';}
  // もう一度ボタンのラベル
  document.getElementById('retry-btn').textContent=isWeakDrill?'苦手ドリルをもう一度！':'同じレベルでもう一度！';
  document.getElementById('res-score').textContent=score;
  const total=qs.length;
  document.getElementById('result-sub-text').textContent=`/ ${total}問 正解`;
  const p=score/total;
  document.getElementById('res-comment').textContent=
    p===1?'満点！すばらしい！🎉':
    p>=0.8?'とてもよくできました！👏':
    p>=0.6?'よくできました！もう少し！😊':'もう一度がんばろう！💪';
  document.getElementById('res-wrong-box').style.display='block';
  document.getElementById('res-wrong-head').textContent='振り返り';
  document.getElementById('res-wrong-items').innerHTML=results.map((r,i)=>
    `<div class="review-row ${r.ok?'review-ok':'review-ng'}">
      <span class="review-num">${i+1}</span>
      <span class="review-mark">${r.ok?'○':'✕'}</span>
      <span class="review-jp">${r.jp}</span>
      <span class="review-ans">
        ${r.ok
          ? `<span class="review-correct">${r.en}</span>`
          : `<span class="review-user">${r.userAns||'（未入力）'}</span><span class="review-arrow">→</span><span class="review-correct">${r.en}</span>`
        }
      </span>
    </div>`
  ).join('');
}

/* ===================== RECORD SCREEN ===================== */
function renderRecord(){
  const d=loadData();
  const sessions=d.sessions||[];
  const weakWords=d.weakWords||{};

  // streak
  document.getElementById('rec-streak-num').textContent=d.streak||0;

  // totals
  document.getElementById('rec-total-sessions').textContent=sessions.length;
  if(sessions.length>0){
    const avg=Math.round(sessions.reduce((s,r)=>s+r.score,0)/sessions.length);
    const best=Math.max(...sessions.map(r=>r.score));
    document.getElementById('rec-total-pct').textContent=Math.round(avg/10*100)+'%';
    document.getElementById('rec-best-score').textContent=best;
  }else{
    document.getElementById('rec-total-pct').textContent='—';
    document.getElementById('rec-best-score').textContent='—';
  }
  const weakCount=Object.keys(weakWords).length;
  document.getElementById('rec-weak-count').textContent=weakCount;

  // level breakdown
  const lvBox=document.getElementById('rec-level-stats');
  lvBox.innerHTML=Object.entries(LEVEL_INFO).map(([key,lv])=>{
    const lvSessions=sessions.filter(s=>s.level===key);
    if(lvSessions.length===0){
      return `<div class="lv-stat-row">
        <span class="lv-stat-emoji">${lv.emoji}</span>
        <div class="lv-stat-info"><div class="lv-stat-name">${lv.name}</div><div class="lv-stat-count">未挑戦</div></div>
        <div class="lv-stat-bar-wrap"><div class="lv-stat-pct" style="color:#ccc">—</div><div class="lv-bar-bg"><div class="lv-bar-fill" style="width:0%;background:${lv.barColor}"></div></div></div>
      </div>`;
    }
    const avgScore=lvSessions.reduce((s,r)=>s+r.score,0)/lvSessions.length;
    const pct=Math.round(avgScore/10*100);
    return `<div class="lv-stat-row">
      <span class="lv-stat-emoji">${lv.emoji}</span>
      <div class="lv-stat-info"><div class="lv-stat-name">${lv.name}</div><div class="lv-stat-count">${lvSessions.length}回挑戦</div></div>
      <div class="lv-stat-bar-wrap"><div class="lv-stat-pct" style="color:${lv.barColor}">${pct}%</div><div class="lv-bar-bg"><div class="lv-bar-fill" style="width:${pct}%;background:${lv.barColor}"></div></div></div>
    </div>`;
  }).join('');

  // weak words top10
  const weakBox=document.getElementById('rec-weak-box');
  const weakArr=Object.values(weakWords).sort((a,b)=>b.count-a.count).slice(0,10);
  if(weakArr.length===0){
    weakBox.innerHTML='<div class="empty-note">まだ記録がありません</div>';
  }else{
    weakBox.innerHTML=weakArr.map(w=>
      `<div class="weak-row">
        <span class="weak-jp">${w.jp}</span>
        <div class="weak-right">
          <span class="weak-en">${w.en}</span>
          <span class="weak-cnt">✕${w.count}</span>
        </div>
      </div>`
    ).join('');
  }

  // history
  const histBox=document.getElementById('rec-history-box');
  const recent=[...sessions].reverse().slice(0,20);
  if(recent.length===0){
    histBox.innerHTML='<div class="empty-note">まだ記録がありません</div>';
  }else{
    histBox.innerHTML=recent.map(s=>{
      const lv=LEVEL_INFO[s.level];
      const pct=Math.round(s.score/s.total*100);
      return `<div class="history-row">
        <span class="history-date">${s.date}</span>
        <span class="history-lv ${lv.cls}">${lv.emoji} ${lv.name}</span>
        <span class="history-score">${s.score} / ${s.total}</span>
        <span class="history-pct">${pct}%</span>
      </div>`;
    }).join('');
  }

  // 苦手ドリルボタンの状態更新
  const recBtn=document.getElementById('rec-weak-btn');
  const recSub=document.getElementById('rec-weak-btn-sub');
  if(weakCount===0){
    recBtn.classList.add('disabled');
    recBtn.onclick=null;
    recSub.textContent='苦手単語がまだありません';
  }else{
    recBtn.classList.remove('disabled');
    recBtn.onclick=startWeakDrill;
    recSub.textContent=`${Math.min(weakCount,10)}単語で練習`;
  }
}
/* ===================== START STATS ===================== */
function renderStartStats(){
  const d=loadData();
  const sessions=d.sessions||[];
  document.getElementById('start-streak-num').textContent=d.streak||0;
  ['elem','jh1','jh2','jh3'].forEach(lv=>{
    const el=document.getElementById('stat-'+lv);
    const lvSessions=sessions.filter(s=>s.level===lv);
    if(lvSessions.length===0){el.textContent='未挑戦';return;}
    const avg=Math.round(lvSessions.reduce((s,r)=>s+r.score,0)/lvSessions.length/10*100);
    el.textContent=`平均 ${avg}% (${lvSessions.length}回)`;
  });
  // ホーム画面の苦手ドリルボタン更新
  const d2=loadData();
  const wc=Object.keys(d2.weakWords||{}).length;
  const homeBtn=document.getElementById('home-weak-btn');
  const homeSub=document.getElementById('home-weak-sub');
  const homeCnt=document.getElementById('home-weak-count');
  if(wc===0){
    homeBtn.classList.add('disabled');
    homeBtn.onclick=null;
    homeSub.textContent='苦手単語がまだありません';
    homeCnt.textContent='';
  }else{
    homeBtn.classList.remove('disabled');
    homeBtn.onclick=startWeakDrill;
    homeSub.textContent='まちがえた単語を集中練習';
    homeCnt.textContent=Math.min(wc,10)+'問';
  }
}
/* ===================== CLEAR ===================== */
function confirmClear(){
  if(confirm('学習記録をすべてリセットしますか？')){
    localStorage.removeItem(STORAGE_KEY);
    renderRecord();
    renderStartStats();
  }
}

/* ===================== INIT ===================== */
renderStartStats();
</script>
